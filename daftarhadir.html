<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Hadir Kegiatan</title>

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 25px;
  }

  .container {
    width: 92%;
    max-width: 420px;
  }

  .logo-box {
    text-align: center;
  }

  .logo-box img {
    width: 110px;
    border-radius: 10px;
    margin-bottom: 8px;
  }

  h2 {
    text-align: center;
    margin: 2px;
    font-weight: bold;
  }

  form {
    background: #ffb300;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-top: 8px;
  }

  label { font-weight: bold; margin-top: 10px; display: block; }

  input, select {
    width: 100%;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    margin-top: 4px;
  }

  button {
    margin-top: 14px;
    width: 100%;
    background: #0066cc;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    border: none;
    cursor: pointer;
    transition: .2s;
  }

  button:hover { background: #004a99; }

  .msg {
    margin-top: 10px;
    font-weight: bold;
    text-align: center;
  }

  /* Loading Animasi */
  #loading {
    display: none;
    text-align: center;
    margin-top: 10px;
    font-size: 15px;
  }

  .lds-ring {
    display: inline-block;
    position: relative;
    width: 50px;
    height: 50px;
  }
  .lds-ring div {
    box-sizing: border-box;
    display: block;
    position: absolute;
    width: 40px;
    height: 40px;
    margin: 6px;
    border: 4px solid #0066cc;
    border-radius: 50%;
    animation: lds-ring 1.2s linear infinite;
    border-color: #0066cc transparent transparent transparent;
  }
  @keyframes lds-ring {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Floating WA Button */
  .wa-btn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: #25D366;
    color: #fff;
    padding: 14px 17px;
    border-radius: 50px;
    font-size: 17px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>

<div class="container">

  <!-- Logo -->
  <div class="logo-box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/Garuda_Pancasila_logo.png">
  </div>

  <h2>Form Daftar Hadir</h2>
  <h2>KOSTRAT</h2>

  <form id="daftarHadirForm">
    <label>Nama:</label>
    <input type="text" id="nama" name="nama" required>

    <label>Lembaga:</label>
    <select id="Lembaga" name="Lembaga" required>
      <option value="">-- Pilih Lembaga --</option>
      <option value="DPAC">DPAC</option>
      <option value="DPC">DPC</option>
      <option value="DPP">DPP</option>
    </select>

    <label>Jabatan:</label>
    <input type="text" id="Jabatan" name="Jabatan" required>

    <label>Keterangan:</label>
    <select id="keterangan" name="keterangan" required>
      <option value="">-- Pilih Keterangan --</option>
      <option value="Hadir">Hadir</option>
      <option value="Izin">Izin</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>

    <button type="submit">Kirim Kehadiran</button>

    <div id="loading">
      <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
      <div>Ngirim dulu yok... ⏳</div>
    </div>

    <div class="msg" id="msg"></div>
  </form>
</div>

<!-- Tombol WhatsApp -->
<a class="wa-btn" href="https://wa.me/6285783449817?text=Assalamualaikum,%20saya%20sudah%20absen%20bos👍" target="_blank">
  💬 WA Admin
</a>

<script>
const scriptURL = 
"https://script.google.com/macros/s/AKfycbzekSzLdcFWzG8d9_acNrZYSoSa5jXh4GDXadM97E4N_lZ7DMPJ5hhuB_9SyFTKlSDTRg/exec";


document.getElementById("daftarHadirForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const msgDiv = document.getElementById("msg");
  const loading = document.getElementById("loading");

  msgDiv.innerHTML = "";
  loading.style.display = "block";

  try {
    const response = await fetch(scriptURL, { method: "POST", body: formData });
    const text = await response.text();
    msgDiv.innerHTML = text;
    form.reset();
  } catch {
    msgDiv.innerHTML = "❌ Jaringan gangguan, coba lagi Jeme!";
  }

  loading.style.display = "none";
});
</script>

</body>
</html>
