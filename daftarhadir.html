<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Hadir Online</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #007bff, #00c3ff);
  padding: 50px;
  color: #333;
}
.card {
  background: white;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  display: inline-block;
  min-width: 300px;
}
input {
  width: 90%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
  text-align: center;
  font-size: 16px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background-color: #007bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
}
button:hover { background-color: #0056b3; }
.status {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}
.hadir { color: green; }
</style>
</head>
<body>

  <div class="card">
    <h2>📋 Daftar Hadir Online</h2>
    <input type="text" id="nama" placeholder="Masukkan nama anda"><br>
    <button onclick="absen()">Hadir</button>
    <div id="status" class="status"></div>
  </div>

<script>
async function absen() {
  const nama = document.getElementById("nama").value.trim();
  const statusBox = document.getElementById("status");

  if (nama === "") {
    statusBox.innerHTML = "⚠️ Silakan isi nama terlebih dahulu!";
    statusBox.classList.remove("hadir");
    return;
  }

  // Link Web App dari Google Script (sudah kau kirim)
  const scriptURL = "https://script.google.com/macros/s/AKfycbwxvaZ0ksjGBAa3zHBnxZP4bLdocdgGJ67s9PNYBQrO8OcwwE4S6i6OKu6tYa29ZsApbw/exec";

  try {
    const response = await fetch(scriptURL + "?nama=" + encodeURIComponent(nama));
    const result = await response.text();

    statusBox.innerHTML = result;
    statusBox.classList.add("hadir");
    document.getElementById("nama").disabled = true;
    document.querySelector("button").disabled = true;
    document.querySelector("button").style.backgroundColor = "#999";
  } catch (err) {
    statusBox.innerHTML = "❌ Gagal menyimpan, coba lagi!";
    statusBox.classList.remove("hadir");
    console.error(err);
  }
}
</script>

</body>
</html>
