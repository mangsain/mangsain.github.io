<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Hadir Kegiatan</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: #0066cc;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #004a99;
    }

    .msg {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Form Daftar Hadir</h2>
  <form id="daftarHadirForm">
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

    <label for="lembaga">Lembaga:</label>
    <input type="text" id="lembaga" name="lembaga" placeholder="Masukkan nama lembaga" required>

    <label for="jabatan">Jabatan:</label>
    <input type="text" id="jabatan" name="jabatan" placeholder="Masukkan jabatan" required>

    <label for="keterangan">Keterangan:</label>
    <textarea id="keterangan" name="keterangan" rows="2" placeholder="Opsional..."></textarea>

    <button type="submit">Kirim Kehadiran</button>

    <div class="msg" id="msg"></div>
  </form>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxOwmcuQgEwAfphsHfS9dY7gZJK0rECN90MY6v3NEIS9VIxQb4yuRlKyc7Q13YfRBia0w/exec";

    document.getElementById("daftarHadirForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nama = document.getElementById("nama").value.trim();
      const lembaga = document.getElementById("lembaga").value.trim();
      const jabatan = document.getElementById("jabatan").value.trim();
      const keterangan = document.getElementById("keterangan").value.trim();

      const params = new URLSearchParams({
        nama: encodeURIComponent(nama),
        lembaga: encodeURIComponent(lembaga),
        jabatan: encodeURIComponent(jabatan),
        keterangan: encodeURIComponent(keterangan)
      });

      const msgDiv = document.getElementById("msg");
      msgDiv.innerHTML = "⏳ Mengirim data...";

      try {
        const response = await fetch(`${scriptURL}?${params}`);
        const text = await response.text();
        msgDiv.innerHTML = text;
        document.getElementById("daftarHadirForm").reset();
      } catch (error) {
        msgDiv.innerHTML = "❌ Gagal mengirim data, periksa koneksi!";
      }
    });
  </script>
</body>
</html>
