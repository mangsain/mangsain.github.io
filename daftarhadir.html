<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Hadir Kegiatan</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      color: #333;
      margin-bottom: 12px;
      padding: 0px;
      margin-top: 4px;
    }

    form {
      background: #fF7F00;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      margin-top: 5px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 5px;
      margin-top: 2px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 12px;
    }

    button {
      margin-top: 10px;
      width: 40%;
      background: #0066cc;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      
      display: block;        
      margin-left: auto;     
      margin-right: auto; 
    }

    button:hover {
      background: #004a99;
    }

    .msg {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <style>
  .header-compact h2 { margin: 0; }
  .header-compact h2 + h2 { margin-top: 3px; }
</style>

<div class="header-compact">
  <h2 style="text-align:center;">Form Daftar Hadir</h2>
<h2 style="text-align:center; margin-top:5px;">KOSTRAT</h2>
</div>
  <form id="daftarHadirForm">
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

   

    <label for="Lembaga">Lembaga:</label>
    <select id="Lembaga" name="Lembaga" required>
      <option value="">-- Pilih Lembaga --</option>
      <option value="DPAC">DPAC</option>
      <option value="DPC">DPC</option>
      <option value="DPP">DPP</option>
    </select>
    
     <label for="Jabatan">Jabatan:</label>
    <input type="text" id="Jabatan" name="Jabatan" placeholder="Masukkan Jabatan" required>

    <label for="keterangan">Keterangan:</label>
    <select id="keterangan" name="keterangan" required>
      <option value="">-- Pilih Keterangan --</option>
      <option value="Hadir">Hadir</option>
      <option value="Izin">Izin</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>

    <button type="submit">Kirim Kehadiran</button>

    <div class="msg" id="msg"></div>
  </form>

  <script>
    const scriptURL = 

"https://script.google.com/macros/s/AKfycbzekSzLdcFWzG8d9_acNrZYSoSa5jXh4GDXadM97E4N_lZ7DMPJ5hhuB_9SyFTKlSDTRg/exec";

    document.getElementById("daftarHadirForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form); // biar spasi tetap aman
      
      const msgDiv = document.getElementById("msg");
      msgDiv.innerHTML = "⏳ Mengirim data...";

      try {
        const response = await fetch(scriptURL, {
          method: "POST",
          body: formData
        });
        const text = await response.text();
        msgDiv.innerHTML = text;
        form.reset();
      } catch (error) {
        msgDiv.innerHTML = "❌ Gagal mengirim data, periksa koneksi!";
      }
    });
  </script>
</body>
</html>
