<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Hadir Online</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #007bff, #00c3ff);
  padding: 50px;
  color: #333;
}
.card {
  background: white;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  display: inline-block;
  min-width: 320px;
}
input, textarea {
  width: 90%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
  text-align: center;
  font-size: 16px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background-color: #007bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
}
button:hover { background-color: #0056b3; }
.status {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}
.hadir { color: green; }
</style>
</head>
<body>

  <div class="card">
    <h2>📋 Daftar Hadir Online</h2>

    <input type="text" id="nama" placeholder="Masukkan nama anda"><br>
    <input type="text" id="lembaga" placeholder="Masukkan nama lembaga / instansi"><br>
    <input type="text" id="jabatan" placeholder="Masukkan jabatan anda"><br>
    <textarea id="keterangan" placeholder="Tambahkan keterangan (opsional)"></textarea><br>

    <button onclick="absen()">Hadir</button>
    <div id="status" class="status"></div>
  </div>

<script>
async function absen() {
  const nama = document.getElementById("nama").value.trim();
  const lembaga = document.getElementById("lembaga").value.trim();
  const jabatan = document.getElementById("jabatan").value.trim();
  const keterangan = document.getElementById("keterangan").value.trim();
  const statusBox = document.getElementById("status");

  if (nama === "" || lembaga === "" || jabatan === "") {
    statusBox.innerHTML = "⚠️ Harap isi semua data (nama, lembaga, jabatan)!";
    statusBox.classList.remove("hadir");
    return;
  }

  // URL Web App dari Google Script Jeme Semende
  const scriptURL = "https://script.google.com/macros/s/AKfycbwxvaZ0ksjGBAa3zHBnxZP4bLdocdgGJ67s9PNYBQrO8OcwwE4S6i6OKu6tYa29ZsApbw/exec";

  try {
    const params = new URLSearchParams({
      nama: nama,
      lembaga: lembaga,
      jabatan: jabatan,
      keterangan: keterangan
    });

    const response = await fetch(`${scriptURL}?${params.toString()}`);
    const result = await response.text();

    statusBox.innerHTML = result;
    statusBox.classList.add("hadir");

    // Kunci semua input setelah berhasil absen
    document.querySelectorAll("input, textarea, button").forEach(el => {
      el.disabled = true;
      if (el.tagName === "BUTTON") el.style.backgroundColor = "#999";
    });

  } catch (err) {
    statusBox.innerHTML = "❌ Gagal menyimpan, coba lagi!";
    statusBox.classList.remove("hadir");
    console.error(err);
  }
}
</script>

</body>
</html>
