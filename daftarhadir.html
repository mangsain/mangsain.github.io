<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Hadir Kegiatan</title>

<style>
  body { font-family:'Segoe UI'; background:#eef2f7; padding-top:20px; display:flex; justify-content:center; }
  .container { width:92%; max-width:420px; }

  form { background:#ffb300; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }

  input, select {
    width:95%; padding:10px; border:2px solid #ccc; border-radius:8px; margin-top:4px;
  }

  button {
    margin-top:14px; width:80%; background:#0066cc; color:#fff;
    padding:12px; border-radius:8px; border:none; cursor:pointer; display:block; margin-left:auto; margin-right:auto;
  }
  button:hover { background:#004a99; }

  .msg { text-align:center; margin-top:10px; font-weight:bold; }
  #loading { display:none; text-align:center; margin-top:10px; }

  /* ✅ Floating WA Button */
  .wa-btn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: #25D366;
    color: #fff;
    padding: 14px 17px;
    border-radius: 50px;
    font-size: 17px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<div class="container">
  <h2 style="text-align:center;">Form Daftar Hadir<br>KOSTRAT</h2>

  <form id="daftarHadirForm">
    <label>Nama:</label>
    <input type="text" id="nama" name="nama" required>

    <label>Lembaga:</label>
    <select id="Lembaga" name="Lembaga" required>
      <option value="">-- Pilih Lembaga --</option>
      <option value="DPAC">DPAC</option>
      <option value="DPC">DPC</option>
      <option value="DPD">DPD</option>
      <option value="DPP">DPP</option>
    </select>

    <label>Jabatan:</label>
    <input type="text" id="Jabatan" name="Jabatan" required>

    <label>Keterangan:</label>
    <select id="keterangan" name="keterangan" required>
      <option value="">-- Pilih Keterangan --</option>
      <option value="Hadir">Hadir</option>
      <option value="Izin">Izin</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>

    <button type="submit">Kirim Kehadiran</button>

    <div id="loading">Ngirim dulu yok... ⏳</div>
    <div class="msg" id="msg"></div>
  </form>
</div>

<!-- ✅ Tombol WhatsApp -->
<a class="wa-btn" href="https://wa.me/6285783449817?text=Assalamualaikum,%20saya%20sudah%20absen%20bos👍" target="_blank">
  💬 WA Admin
</a>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbyfMwKuJVt9cQ52R99Uu_BYq6CsdSwOqyE0Mxi0ahQcUrFPnGz6MzKZBo1bTvAlwX3GfA/exec";

function cekAbsenLocal(){
  const last=localStorage.getItem("lastAbsenTime");
  const form=document.getElementById("daftarHadirForm");
  const btn=document.querySelector("button");
  const msg=document.getElementById("msg");
  if(!last) return;
  const now=Date.now(); const diff=(now-last)/(1000*60*60);
  if(diff<24){
    btn.disabled=true; form.style.opacity="0.5";
    msg.innerHTML=`⚠️ Jeme sudah absen. Tunggu ${Math.ceil(24-diff)} jam lagi yo.`;
  }
}

document.getElementById("daftarHadirForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const form=e.target; const msg=document.getElementById("msg");
  const loading=document.getElementById("loading");
  loading.style.display="block"; msg.innerHTML="";
  try{
    const r=await fetch(scriptURL,{method:"POST",body:new FormData(form)});
    const t=await r.text(); msg.innerHTML=t;
    localStorage.setItem("lastAbsenTime",Date.now());
    form.reset(); cekAbsenLocal();
  }catch{ msg.innerHTML="❌ Jaringan error, ulangi cak!"; }
  loading.style.display="none";
});

cekAbsenLocal();
</script>

</body>
</html>
